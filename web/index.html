<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18202A">
<title>Тренировки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one narrow column like a gym log card; sticky header with tabs, timer docked to the bottom edge. Plate colours: blue = action, yellow = done. */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --sunken: #F4F6F9;
  --ink: #141A22;
  --muted: #5B6573;
  --line: #D3D9E1;
  --accent: #1D5BBF;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE7F8;
  --done: #E9B80C;
  --done-soft: #FBF0C7;
  --good: #23824F;
  --warn: #B4422F;
  --f-display: "Oswald", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1319; --surface: #18202A; --sunken: #121820; --ink: #E8EDF3; --muted: #97A1AE;
    --line: #2A3441; --accent: #6A9BEA; --accent-ink: #0B1220; --accent-soft: #1E2D45;
    --done: #F0C940; --done-soft: #3A3218; --good: #5BC28A; --warn: #E8806C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1319; --surface: #18202A; --sunken: #121820; --ink: #E8EDF3; --muted: #97A1AE;
  --line: #2A3441; --accent: #6A9BEA; --accent-ink: #0B1220; --accent-soft: #1E2D45;
  --done: #F0C940; --done-soft: #3A3218; --good: #5BC28A; --warn: #E8806C; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; min-height: 100vh; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.auth { max-width: 420px; margin: 24px auto 0; }
.err { color: var(--warn); }
label.btn { display: inline-block; cursor: pointer; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.1; }
.status { font-size: 12px; color: var(--muted); white-space: nowrap; }
.status.bad { color: var(--warn); }
.status.ok { color: var(--good); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: 0 0 auto; padding: 8px 10px 10px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 16px 140px; }
section.view { display: flex; flex-direction: column; gap: 14px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h3 { margin: 0; font-size: 16px; font-weight: 700; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.banner { background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; font-size: 14px; }
.banner.warn { background: var(--done-soft); }

/* controls */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--sunken); padding: 4px; border-radius: var(--r); }
.seg button { border: 0; background: transparent; padding: 9px 4px; border-radius: 7px; font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .02em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button .nx { display: block; font-family: var(--f-body); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
input, select, textarea {
  background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; width: 100%;
}
textarea { min-height: 70px; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grid-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.targets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { color: var(--good); }
.chip.warn { color: var(--warn); }

/* exercise card */
.ex { gap: 8px; }
.ex.done-all { border-color: var(--done); }
.ex-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.plan { font-family: var(--f-display); font-size: 16px; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prev { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sugg { font-size: 13px; background: var(--accent-soft); border-radius: 6px; padding: 5px 8px; }
.sugg b { font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 26px repeat(3, minmax(0, 1fr)) 48px; gap: 6px; align-items: center; }
.set.nw { grid-template-columns: 26px repeat(2, minmax(0, 1fr)) 48px; }
.set .n { font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
.set input { text-align: center; font-family: var(--f-display); font-size: 20px; font-weight: 600; padding: 6px 4px; font-variant-numeric: tabular-nums; }
.set input::placeholder { color: var(--muted); opacity: .55; font-weight: 500; }
.set-hdr { display: grid; grid-template-columns: 26px repeat(3, minmax(0, 1fr)) 48px; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.set-hdr.nw { grid-template-columns: 26px repeat(2, minmax(0, 1fr)) 48px; }
.tick { height: 42px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700; color: var(--muted); }
.set.done .tick { background: var(--done); border-color: var(--done); color: #1A1600; }
.set.done input { background: var(--done-soft); border-color: transparent; }
.e1 { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* timer */
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink); color: var(--bg);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.timer .in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.timer .clock { font-family: var(--f-display); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; min-width: 84px; }
.timer .what { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
.timer button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; padding: 7px 10px; font-weight: 700; opacity: .9; }
.timer .bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--done); }
.timer.over { background: var(--done); color: #1A1600; }

/* tables & charts */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .raw { fill: var(--muted); opacity: .45; }
.chart .avg { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.chart .ser2 { fill: none; stroke: var(--done); stroke-width: 2.5; }
.chart .end { fill: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lifts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.lift .v { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.spark { width: 100%; height: 40px; display: block; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark circle { fill: var(--accent); }
.hist-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hist-item .t { font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
ul.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 420px) { .set input { font-size: 18px; } .brand h1 { font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1 id="app-name">Тренировки</h1><span class="status" id="status"></span></div>
    <nav class="tabs" id="nav" aria-label="Разделы" hidden>
      <a href="#train" data-v="train">Тренировка</a>
      <a href="#log" data-v="log">Дневник</a>
      <a href="#progress" data-v="progress">Прогресс</a>
      <a href="#history" data-v="history">История</a>
      <a href="#program" data-v="program">Программа</a>
      <a href="#account" data-v="account">Аккаунт</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div id="notice" class="banner warn" hidden></div>
  <section class="view" id="view-auth"></section>
  <section class="view" id="view-train" hidden></section>
  <section class="view" id="view-log" hidden></section>
  <section class="view" id="view-progress" hidden></section>
  <section class="view" id="view-history" hidden></section>
  <section class="view" id="view-program" hidden></section>
  <section class="view" id="view-account" hidden></section>
</main>
<input type="file" id="file-in" hidden>
<div class="timer" id="timer" hidden>
  <div class="bar" id="t-bar"></div>
  <div class="in">
    <div class="clock" id="t-clock">0:00</div>
    <div class="what" id="t-what"></div>
    <button type="button" id="t-minus" aria-label="Минус 15 секунд">−15</button>
    <button type="button" id="t-plus" aria-label="Плюс 15 секунд">+15</button>
    <button type="button" id="t-stop">Стоп</button>
  </div>
</div>
<script src="config.js"></script>
<script src="programs.js"></script>
<script src="app.js"></script>
</body>
</html>
